services:
  backend:
    build:
      context: ./backend
    container_name: parser-backend
    ports:
      - "8003:8003"
    environment:
      GS_DATA_DIR: /app/gs_data
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CRAWLER_HEADLESS: ${CRAWLER_HEADLESS:-true}
      DATABASE_HOST: ${DATABASE_HOST:-database}
      DATABASE_PORT: ${DATABASE_PORT:-3306}
      DATABASE_NAME: ${DATABASE_NAME:-parser_db}
      DATABASE_USER: ${DATABASE_USER:-minerva}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-minerva_password}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      # tetto per singolo giudizio. su una macchina normale non si raggiunge mai,
      # lì un giudizio costa circa 7s. serve sulle macchine lente: senza, undici
      # entry da 120s sfondano il tempo di risposta di /full_gs_eval e la richiesta
      # non arriva in fondo. con 25 il ripiego costa poco e restano 85s per il
      # parsing delle undici pagine, che su una macchina lenta rallenta anche lui
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-25}
      STATUS_CHECK_TIMEOUT: ${STATUS_CHECK_TIMEOUT:-1.0}
    volumes:
      - ./gs_data:/app/gs_data
    depends_on:
      database:
        condition: service_healthy
      ollama:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: parser-frontend
    ports:
      - "8004:8004"
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend:8003}
      # serve solo alla home per scrivere quale modello fa da judge
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    depends_on:
      - backend

  database:
    image: mariadb:11.4
    container_name: parser-database
    environment:
      MARIADB_DATABASE: ${DATABASE_NAME:-parser_db}
      MARIADB_USER: ${DATABASE_USER:-minerva}
      MARIADB_PASSWORD: ${DATABASE_PASSWORD:-minerva_password}
      MARIADB_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:-root_password}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    # fissata al digest e non a "latest": l'entrypoint qui sotto usa
    # --think=false e l'healthcheck legge l'output di "ollama ps", due cose
    # che una versione futura puo' cambiare. col digest chi corregge scarica
    # esattamente l'immagine su cui abbiamo passato i test
    image: ollama/ollama@sha256:4dea9fb511947e24a84237bb636b0203abcb2ff0d3fbc7b4ff865deb91362131
    container_name: parser-ollama
    environment:
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # l'immagine avvia solo il server, il pull va esplicitato a parte
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        ollama serve &
        pid=$$!
        until ollama list >/dev/null 2>&1; do sleep 1; done
        ollama pull "$$OLLAMA_MODEL"
        ollama run "$$OLLAMA_MODEL" --think=false \
          "Reply with only OK." >/dev/null
        wait $$pid
    # healthy solo a modello caricato in RAM, non soltanto scaricato
    healthcheck:
      test: ["CMD-SHELL", "ollama ps | grep -Fq $$OLLAMA_MODEL"]
      start_period: 60s
      interval: 10s
      timeout: 10s
      # 180 tentativi sono mezz'ora: il modello pesa 2.5 GB e con i 60 di
      # prima bastava una rete lenta per far scadere l'healthcheck, con il
      # backend che poi non parte per via del depends_on. se ollama e' sano
      # il check passa subito lo stesso, questo margine non costa niente
      retries: 180

volumes:
  mariadb_data:
  ollama_data:
